<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>번역 도구</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .log-box::-webkit-scrollbar { width: 6px; }
        .log-box::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex flex-col" x-data="app()" x-init="init()" x-cloak>

<!-- Header -->
<header class="bg-white border-b px-6 py-3 flex items-center justify-between shrink-0">
    <h1 class="text-lg font-bold">번역 도구</h1>
    <div class="flex items-center gap-3 text-sm">
        <span x-show="runningTask" class="text-blue-600 flex items-center gap-1">
            <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            작업 진행 중
        </span>
        <span x-show="!runningTask" class="text-gray-400">대기 중</span>
    </div>
</header>

<!-- Main -->
<div class="flex flex-1 overflow-hidden">

<!-- Sidebar -->
<aside class="w-72 bg-white border-r p-4 overflow-y-auto shrink-0 space-y-5">

    <!-- File Selection -->
    <section>
        <h2 class="text-xs font-bold text-gray-500 uppercase mb-2">파일 선택</h2>
        <label class="block text-sm mb-1">입력 파일</label>
        <select x-model="selectedInput" @change="autoOutputName()"
                class="w-full border rounded px-2 py-1.5 text-sm bg-white">
            <option value="">선택...</option>
            <template x-for="f in inputFiles" :key="f.name">
                <option :value="f.name" x-text="f.name + ' (' + formatSize(f.size) + ')'"></option>
            </template>
        </select>
        <label class="block text-sm mt-2 mb-1">출력 파일명</label>
        <input x-model="outputFilename" class="w-full border rounded px-2 py-1.5 text-sm" placeholder="output.txt">
    </section>

    <!-- Config -->
    <section>
        <h2 class="text-xs font-bold text-gray-500 uppercase mb-2">설정</h2>
        <div class="space-y-2 text-sm">
            <div>
                <label class="block text-gray-600">청크 크기</label>
                <input type="number" x-model.number="config.chunk_size" class="w-full border rounded px-2 py-1">
            </div>
            <div>
                <label class="block text-gray-600">오버랩 문장</label>
                <input type="number" x-model.number="config.overlap_sentences" class="w-full border rounded px-2 py-1">
            </div>
            <div class="flex gap-2">
                <div class="flex-1">
                    <label class="block text-gray-600">원문</label>
                    <select x-model="config.source_lang" class="w-full border rounded px-2 py-1 bg-white">
                        <option value="ja">일본어</option>
                        <option value="en">영어</option>
                    </select>
                </div>
                <div class="flex-1">
                    <label class="block text-gray-600">번역</label>
                    <select x-model="config.target_lang" class="w-full border rounded px-2 py-1 bg-white">
                        <option value="ko">한국어</option>
                        <option value="en">영어</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-gray-600">모델</label>
                <input x-model="config.model" class="w-full border rounded px-2 py-1 text-xs font-mono">
            </div>
        </div>
        <button @click="saveConfig()" class="mt-2 w-full bg-gray-100 hover:bg-gray-200 text-sm py-1 rounded">
            설정 저장
        </button>
    </section>

    <!-- Quick Edit -->
    <section>
        <h2 class="text-xs font-bold text-gray-500 uppercase mb-2">편집</h2>
        <div class="space-y-1">
            <button @click="showGlossaryModal=true; loadGlossary()"
                    class="w-full text-left text-sm px-2 py-1.5 rounded hover:bg-gray-100">
                용어사전 편집
            </button>
            <button @click="showRulesModal=true; loadRules()"
                    class="w-full text-left text-sm px-2 py-1.5 rounded hover:bg-gray-100">
                번역규칙 편집
            </button>
        </div>
    </section>
</aside>

<!-- Main Content -->
<main class="flex-1 flex flex-col overflow-hidden">

    <!-- Tabs -->
    <div class="border-b bg-white px-4 shrink-0">
        <nav class="flex gap-1">
            <template x-for="tab in [{id:'extract',label:'1. 용어추출'},{id:'translate',label:'2. 번역'},{id:'review',label:'3. 리뷰'}]">
                <button @click="activeTab=tab.id"
                        :class="activeTab===tab.id ? 'border-b-2 border-blue-500 text-blue-600 font-medium' : 'text-gray-500 hover:text-gray-700'"
                        class="px-4 py-2.5 text-sm transition-colors" x-text="tab.label"></button>
            </template>
        </nav>
    </div>

    <!-- Tab Content -->
    <div class="flex-1 overflow-y-auto p-4">

        <!-- ═══ Translate Tab ═══ -->
        <div x-show="activeTab==='translate'" class="space-y-4">
            <div class="flex gap-2 flex-wrap">
                <button @click="dryRun()" :disabled="!selectedInput || runningTask"
                        class="px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 rounded disabled:opacity-40">
                    분석
                </button>
                <button @click="startTranslation()" :disabled="!selectedInput || !outputFilename || runningTask"
                        class="px-3 py-1.5 text-sm bg-blue-500 text-white hover:bg-blue-600 rounded disabled:opacity-40">
                    번역 시작
                </button>
                <button @click="startTranslation(true)" :disabled="!selectedInput || !outputFilename || runningTask"
                        class="px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 rounded disabled:opacity-40">
                    이어하기
                </button>
                <button @click="cancelCurrentTask()" x-show="runningTask"
                        class="px-3 py-1.5 text-sm bg-red-500 text-white hover:bg-red-600 rounded">
                    중단
                </button>
            </div>

            <!-- Progress -->
            <div x-show="translateProgress.total > 0" class="space-y-1">
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div class="bg-blue-500 h-2 rounded-full transition-all duration-300"
                         :style="`width:${(translateProgress.current/translateProgress.total)*100}%`"></div>
                </div>
                <p class="text-xs text-gray-500" x-text="`${translateProgress.current} / ${translateProgress.total} 청크`"></p>
            </div>

            <!-- Dry Run Result -->
            <div x-show="dryRunResult" class="border rounded-lg overflow-hidden">
                <div class="bg-gray-50 px-3 py-2 text-sm font-medium border-b flex justify-between">
                    <span x-text="'청크 분석 — 총 ' + (dryRunResult?.total_chunks||0) + '개'"></span>
                    <button @click="dryRunResult=null" class="text-gray-400 hover:text-gray-600">닫기</button>
                </div>
                <div class="max-h-48 overflow-y-auto">
                    <table class="w-full text-xs">
                        <thead class="bg-gray-50 sticky top-0"><tr>
                            <th class="px-3 py-1 text-left">#</th>
                            <th class="px-3 py-1 text-right">글자수</th>
                            <th class="px-3 py-1 text-right">문장수</th>
                            <th class="px-3 py-1 text-left">미리보기</th>
                        </tr></thead>
                        <tbody>
                            <template x-for="c in dryRunResult?.chunks||[]" :key="c.chunk_num">
                                <tr class="border-t">
                                    <td class="px-3 py-1" x-text="c.chunk_num"></td>
                                    <td class="px-3 py-1 text-right" x-text="c.char_count.toLocaleString()"></td>
                                    <td class="px-3 py-1 text-right" x-text="c.sentence_count"></td>
                                    <td class="px-3 py-1 text-gray-500 truncate max-w-xs" x-text="c.chunk_preview"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Log -->
            <div id="translate-log" class="log-box bg-gray-900 text-gray-300 font-mono text-xs p-3 rounded-lg h-80 overflow-y-auto">
                <template x-for="(line, i) in translateLogs" :key="i">
                    <div x-text="line" :class="line.includes('✓') ? 'text-green-400' : line.includes('⚠') ? 'text-yellow-400' : line.includes('❌') ? 'text-red-400' : ''"></div>
                </template>
                <div x-show="translateLogs.length===0" class="text-gray-600">로그가 여기에 표시됩니다...</div>
            </div>
        </div>

        <!-- ═══ Extract Tab ═══ -->
        <div x-show="activeTab==='extract'" class="space-y-4">
            <div class="flex gap-2">
                <button @click="startExtraction()" :disabled="!selectedInput || runningTask"
                        class="px-3 py-1.5 text-sm bg-blue-500 text-white hover:bg-blue-600 rounded disabled:opacity-40">
                    용어 추출 시작
                </button>
            </div>

            <!-- Log -->
            <div id="extract-log" class="log-box bg-gray-900 text-gray-300 font-mono text-xs p-3 rounded-lg h-40 overflow-y-auto">
                <template x-for="(line, i) in extractLogs" :key="i">
                    <div x-text="line"></div>
                </template>
                <div x-show="extractLogs.length===0" class="text-gray-600">추출 로그...</div>
            </div>

            <!-- Draft Result Table -->
            <div x-show="extractResult && Object.keys(extractResult).length" class="border rounded-lg overflow-hidden">
                <div class="bg-gray-50 px-3 py-2 text-sm font-medium border-b flex justify-between">
                    <span x-text="'추출 결과 — ' + Object.keys(extractResult).length + '개 용어'"></span>
                    <button @click="applyDraft()" class="px-2 py-0.5 bg-blue-500 text-white text-xs rounded hover:bg-blue-600">
                        용어사전에 반영
                    </button>
                </div>
                <div class="max-h-96 overflow-y-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-gray-50 sticky top-0"><tr>
                            <th class="px-3 py-1.5 text-left">원어</th>
                            <th class="px-3 py-1.5 text-left">번역</th>
                            <th class="px-3 py-1.5 text-center">카테고리</th>
                            <th class="px-3 py-1.5 text-center">병기</th>
                            <th class="px-3 py-1.5 text-center">삭제</th>
                        </tr></thead>
                        <tbody>
                            <template x-for="term in Object.keys(extractResult)" :key="term">
                                <tr class="border-t hover:bg-gray-50">
                                    <td class="px-3 py-1 font-mono text-xs" x-text="term"></td>
                                    <td class="px-3 py-1">
                                        <input x-model="extractResult[term].translation"
                                               class="w-full border rounded px-1 py-0.5 text-sm">
                                    </td>
                                    <td class="px-3 py-1 text-center text-xs text-gray-500" x-text="extractResult[term].category"></td>
                                    <td class="px-3 py-1 text-center">
                                        <input type="checkbox" x-model="extractResult[term].annotate">
                                    </td>
                                    <td class="px-3 py-1 text-center">
                                        <button @click="delete extractResult[term]" class="text-red-400 hover:text-red-600 text-xs">삭제</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ═══ Review Tab ═══ -->
        <div x-show="activeTab==='review'" class="space-y-4">
            <div class="flex gap-3 items-center flex-wrap">
                <label class="flex items-center gap-1 text-sm">
                    <input type="checkbox" x-model="reviewOptions.detailed"> 상세 분석
                </label>
                <label class="flex items-center gap-1 text-sm">
                    <input type="checkbox" x-model="reviewOptions.use_ai"> AI 검증
                </label>
                <button @click="startReview()" :disabled="!selectedInput || !outputFilename || runningTask"
                        class="px-3 py-1.5 text-sm bg-blue-500 text-white hover:bg-blue-600 rounded disabled:opacity-40">
                    리뷰 시작
                </button>
                <button @click="cancelCurrentTask()" x-show="runningTask"
                        class="px-3 py-1.5 text-sm bg-red-500 text-white hover:bg-red-600 rounded">
                    중단
                </button>
            </div>

            <!-- Log -->
            <div id="review-log" class="log-box bg-gray-900 text-gray-300 font-mono text-xs p-3 rounded-lg h-40 overflow-y-auto">
                <template x-for="(line, i) in reviewLogs" :key="i">
                    <div x-text="line"></div>
                </template>
                <div x-show="reviewLogs.length===0" class="text-gray-600">리뷰 로그...</div>
            </div>

            <!-- Review Results -->
            <div x-show="reviewResult" class="space-y-3">
                <!-- Sentence counts -->
                <div class="border rounded-lg p-3 text-sm">
                    <h3 class="font-medium mb-1">문장 수 비교</h3>
                    <p>원문: <span x-text="reviewResult?.source_sentences" class="font-mono"></span>문장</p>
                    <p>번역: <span x-text="reviewResult?.target_sentences" class="font-mono"></span>문장</p>
                    <p :class="Math.abs((reviewResult?.target_sentences||0)-(reviewResult?.source_sentences||0)) > 5 ? 'text-red-600' : 'text-green-600'"
                       x-text="'차이: ' + ((reviewResult?.target_sentences||0)-(reviewResult?.source_sentences||0))"></p>
                </div>

                <!-- Glossary issues -->
                <div x-show="reviewResult?.glossary_issues?.length" class="border border-orange-200 rounded-lg p-3 bg-orange-50 text-sm">
                    <h3 class="font-medium text-orange-700 mb-1">용어 불일치</h3>
                    <template x-for="issue in reviewResult?.glossary_issues||[]">
                        <p class="text-orange-800" x-text="`${issue.source_term}: 원문 ${issue.expected_count}회 → '${issue.target_term}' ${issue.actual_count}회`"></p>
                    </template>
                </div>

                <!-- Problem chunks -->
                <div x-show="reviewResult?.problem_chunks?.length" class="border border-red-200 rounded-lg p-3 bg-red-50 text-sm">
                    <h3 class="font-medium text-red-700 mb-1">문제 청크</h3>
                    <p class="text-red-800 mb-2" x-text="'청크: ' + (reviewResult?.problem_chunks||[]).join(', ')"></p>
                    <button @click="retranslateChunks(reviewResult.problem_chunks)"
                            :disabled="runningTask"
                            class="px-3 py-1 bg-red-600 text-white text-xs rounded hover:bg-red-700 disabled:opacity-40">
                        문제 청크 재번역
                    </button>
                </div>

                <!-- AI issues -->
                <div x-show="reviewResult?.ai_issues?.length" class="border border-purple-200 rounded-lg p-3 bg-purple-50 text-sm">
                    <h3 class="font-medium text-purple-700 mb-1">AI 검증 결과</h3>
                    <div class="space-y-1 max-h-60 overflow-y-auto">
                        <template x-for="(issue, i) in reviewResult?.ai_issues||[]" :key="i">
                            <p class="text-purple-800 text-xs" x-text="issue"></p>
                        </template>
                    </div>
                    <button x-show="reviewResult?.ai_problem_chunks?.length"
                            @click="retranslateChunks(reviewResult.ai_problem_chunks)"
                            :disabled="runningTask"
                            class="mt-2 px-3 py-1 bg-purple-600 text-white text-xs rounded hover:bg-purple-700 disabled:opacity-40">
                        AI 지적 청크 재번역
                    </button>
                </div>
            </div>
        </div>

    </div>
</main>
</div>

<!-- ═══ Glossary Modal ═══ -->
<div x-show="showGlossaryModal" x-cloak class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[80vh] flex flex-col" @click.away="showGlossaryModal=false">
        <div class="px-5 py-3 border-b flex justify-between items-center shrink-0">
            <h2 class="font-bold">용어사전 편집</h2>
            <button @click="showGlossaryModal=false" class="text-gray-400 hover:text-gray-600 text-lg">&times;</button>
        </div>
        <div class="flex-1 overflow-y-auto p-5">
            <table class="w-full text-sm">
                <thead><tr class="text-left">
                    <th class="pb-1">원어</th><th class="pb-1">번역</th><th class="pb-1 w-16">삭제</th>
                </tr></thead>
                <tbody>
                    <template x-for="(val, key) in glossary" :key="key">
                        <tr class="border-t">
                            <td class="py-1 pr-2 font-mono text-xs" x-text="key"></td>
                            <td class="py-1 pr-2">
                                <template x-if="typeof val === 'string'">
                                    <input x-model="glossary[key]" class="w-full border rounded px-2 py-0.5 text-sm">
                                </template>
                                <template x-if="typeof val === 'object'">
                                    <input x-model="glossary[key].translation" class="w-full border rounded px-2 py-0.5 text-sm">
                                </template>
                            </td>
                            <td class="py-1 text-center">
                                <button @click="delete glossary[key]" class="text-red-400 hover:text-red-600 text-xs">삭제</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <!-- Add new entry -->
            <div class="flex gap-2 mt-3">
                <input x-model="newGlossaryTerm" placeholder="원어" class="flex-1 border rounded px-2 py-1 text-sm">
                <input x-model="newGlossaryTranslation" placeholder="번역" class="flex-1 border rounded px-2 py-1 text-sm">
                <button @click="if(newGlossaryTerm){glossary[newGlossaryTerm]=newGlossaryTranslation;newGlossaryTerm='';newGlossaryTranslation='';}"
                        class="px-3 py-1 bg-blue-500 text-white text-sm rounded">추가</button>
            </div>
        </div>
        <div class="px-5 py-3 border-t flex gap-2 justify-end shrink-0">
            <button @click="showGlossaryModal=false" class="px-4 py-1.5 text-sm bg-gray-100 rounded hover:bg-gray-200">닫기</button>
            <button @click="saveGlossary();showGlossaryModal=false" class="px-4 py-1.5 text-sm bg-blue-500 text-white rounded hover:bg-blue-600">저장</button>
        </div>
    </div>
</div>

<!-- ═══ Rules Modal ═══ -->
<div x-show="showRulesModal" x-cloak class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[80vh] flex flex-col" @click.away="showRulesModal=false">
        <div class="px-5 py-3 border-b flex justify-between items-center shrink-0">
            <h2 class="font-bold">번역규칙 편집</h2>
            <button @click="showRulesModal=false" class="text-gray-400 hover:text-gray-600 text-lg">&times;</button>
        </div>
        <div class="flex-1 overflow-hidden p-5">
            <textarea x-model="rulesText" class="w-full h-full min-h-[400px] font-mono text-sm border rounded p-3 resize-none"></textarea>
        </div>
        <div class="px-5 py-3 border-t flex gap-2 justify-end shrink-0">
            <button @click="showRulesModal=false" class="px-4 py-1.5 text-sm bg-gray-100 rounded hover:bg-gray-200">닫기</button>
            <button @click="saveRules();showRulesModal=false" class="px-4 py-1.5 text-sm bg-blue-500 text-white rounded hover:bg-blue-600">저장</button>
        </div>
    </div>
</div>

<script>
function app() {
    return {
        activeTab: 'extract',
        config: {},
        inputFiles: [],
        outputFiles: [],
        selectedInput: '',
        outputFilename: '',

        glossary: {},
        rulesText: '',
        showGlossaryModal: false,
        showRulesModal: false,
        newGlossaryTerm: '',
        newGlossaryTranslation: '',

        translateLogs: [],
        translateProgress: { current: 0, total: 0 },
        dryRunResult: null,

        extractLogs: [],
        extractResult: null,

        reviewLogs: [],
        reviewResult: null,
        reviewOptions: { detailed: true, use_ai: false },

        runningTask: null,
        eventSource: null,

        async init() {
            await Promise.all([this.loadConfig(), this.loadFiles()]);
        },

        // ── Helpers ──
        formatSize(bytes) {
            if (bytes < 1024) return bytes + 'B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
            return (bytes / 1048576).toFixed(1) + 'MB';
        },
        autoOutputName() {
            if (this.selectedInput) {
                this.outputFilename = this.selectedInput;
            }
        },
        scrollLog(id) {
            this.$nextTick(() => {
                const el = document.getElementById(id);
                if (el) el.scrollTop = el.scrollHeight;
            });
        },

        // ── API calls ──
        async loadConfig() {
            this.config = await (await fetch('/api/config')).json();
        },
        async saveConfig() {
            await fetch('/api/config', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(this.config)
            });
        },
        async loadFiles() {
            this.inputFiles = await (await fetch('/api/files/input')).json();
            this.outputFiles = await (await fetch('/api/files/output')).json();
        },
        async loadGlossary() {
            this.glossary = await (await fetch('/api/glossary')).json();
        },
        async saveGlossary() {
            await fetch('/api/glossary', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(this.glossary)
            });
        },
        async loadRules() {
            const data = await (await fetch('/api/rules')).json();
            this.rulesText = data.content;
        },
        async saveRules() {
            await fetch('/api/rules', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content: this.rulesText })
            });
        },

        // ── SSE ──
        connectSSE(taskId, logArray, logElId, onResult, onDone) {
            if (this.eventSource) this.eventSource.close();

            this.eventSource = new EventSource(`/api/tasks/${taskId}/stream`);

            this.eventSource.addEventListener('log', (e) => {
                logArray.push(JSON.parse(e.data));
                this.scrollLog(logElId);
            });
            this.eventSource.addEventListener('progress', (e) => {
                this.translateProgress = JSON.parse(e.data);
            });
            this.eventSource.addEventListener('result', (e) => {
                if (onResult) onResult(JSON.parse(e.data));
            });
            this.eventSource.addEventListener('done', (e) => {
                this.eventSource.close();
                this.eventSource = null;
                this.runningTask = null;
                logArray.push('── ' + JSON.parse(e.data) + ' ──');
                this.scrollLog(logElId);
                this.loadFiles();
                if (onDone) onDone();
            });
            this.eventSource.addEventListener('error', (e) => {
                if (this.eventSource) {
                    this.eventSource.close();
                    this.eventSource = null;
                }
                this.runningTask = null;
                logArray.push('[연결 오류]');
                this.scrollLog(logElId);
            });
        },

        // ── Translation ──
        async dryRun() {
            const res = await fetch('/api/translate/dry-run', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ input_file: this.selectedInput })
            });
            this.dryRunResult = await res.json();
        },

        async startTranslation(resume = false) {
            this.translateLogs = [];
            this.translateProgress = { current: 0, total: 0 };

            const res = await fetch('/api/translate/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    input_file: this.selectedInput,
                    output_file: this.outputFilename
                })
            });
            if (!res.ok) {
                const err = await res.json();
                this.translateLogs.push('❌ ' + (err.error || 'Error'));
                return;
            }
            const { task_id } = await res.json();
            this.runningTask = task_id;
            this.connectSSE(task_id, this.translateLogs, 'translate-log');
        },

        async retranslateChunks(chunks) {
            this.activeTab = 'translate';
            this.translateLogs = [];
            this.translateProgress = { current: 0, total: 0 };

            const res = await fetch('/api/translate/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    input_file: this.selectedInput,
                    output_file: this.outputFilename,
                    only_chunks: chunks
                })
            });
            if (!res.ok) {
                const err = await res.json();
                this.translateLogs.push('❌ ' + (err.error || 'Error'));
                return;
            }
            const { task_id } = await res.json();
            this.runningTask = task_id;
            this.connectSSE(task_id, this.translateLogs, 'translate-log');
        },

        // ── Review ──
        async startReview() {
            this.reviewLogs = [];
            this.reviewResult = null;

            const res = await fetch('/api/review/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    source_file: this.selectedInput,
                    translated_file: this.outputFilename,
                    detailed: this.reviewOptions.detailed,
                    use_ai: this.reviewOptions.use_ai
                })
            });
            if (!res.ok) {
                const err = await res.json();
                this.reviewLogs.push('❌ ' + (err.error || 'Error'));
                return;
            }
            const { task_id } = await res.json();
            this.runningTask = task_id;
            this.connectSSE(task_id, this.reviewLogs, 'review-log',
                (result) => { this.reviewResult = result; }
            );
        },

        // ── Extraction ──
        async startExtraction() {
            this.extractLogs = [];
            this.extractResult = null;

            const res = await fetch('/api/extract/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ input_file: this.selectedInput })
            });
            if (!res.ok) {
                const err = await res.json();
                this.extractLogs.push('❌ ' + (err.error || 'Error'));
                return;
            }
            const { task_id } = await res.json();
            this.runningTask = task_id;
            this.connectSSE(task_id, this.extractLogs, 'extract-log',
                (result) => { this.extractResult = result; }
            );
        },

        async applyDraft() {
            // Save the edited draft first
            await fetch('/api/glossary', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({...await (await fetch('/api/glossary')).json(), ...this.extractResult})
            });
            this.extractLogs.push('── 용어사전에 반영 완료 ──');
        },

        // ── Cancel ──
        async cancelCurrentTask() {
            if (this.runningTask) {
                await fetch(`/api/tasks/${this.runningTask}/cancel`, { method: 'POST' });
            }
        },
    };
}
</script>
</body>
</html>
